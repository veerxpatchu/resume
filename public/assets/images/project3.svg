<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p3Grad)" />

  <!-- API Console Mockup -->
  <rect x="30" y="30" width="540" height="320" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="30" y="30" width="540" height="38" rx="12" fill="#1e293b" />
  <circle cx="50" cy="49" r="5" fill="#ef4444" />
  <circle cx="68" cy="49" r="5" fill="#f59e0b" />
  <circle cx="86" cy="49" r="5" fill="#10b981" />
  <text x="110" y="53" font-family="monospace" font-size="12" fill="#34d399">REST API Gateway &amp; Metrics - E-Commerce</text>

  <!-- Request pill -->
  <rect x="50" y="85" width="60" height="24" rx="4" fill="#059669" />
  <text x="80" y="101" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">POST</text>
  <text x="125" y="102" font-family="monospace" font-size="13" fill="#f1f5f9">/api/v1/checkout/process</text>
  <rect x="470" y="85" width="80" height="24" rx="4" fill="#10b981" opacity="0.2" />
  <text x="510" y="101" font-family="monospace" font-size="11" fill="#34d399" text-anchor="middle">200 OK (38ms)</text>

  <!-- JSON Payload box -->
  <rect x="50" y="125" width="240" height="195" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="65" y="148" font-family="monospace" font-size="11" fill="#94a3b8">// Request JSON</text>
  <text x="65" y="170" font-family="monospace" font-size="11" fill="#f43f5e">"order_id"</text>
  <text x="140" y="170" font-family="monospace" font-size="11" fill="#e2e8f0">: "ord_9824"</text>
  <text x="65" y="190" font-family="monospace" font-size="11" fill="#f43f5e">"amount"</text>
  <text x="140" y="190" font-family="monospace" font-size="11" fill="#38bdf8">: 2450.00</text>
  <text x="65" y="210" font-family="monospace" font-size="11" fill="#f43f5e">"currency"</text>
  <text x="140" y="210" font-family="monospace" font-size="11" fill="#e2e8f0">: "THB"</text>
  <text x="65" y="230" font-family="monospace" font-size="11" fill="#f43f5e">"status"</text>
  <text x="140" y="230" font-family="monospace" font-size="11" fill="#10b981">: "PAID"</text>

  <!-- Stats & Metric Cards on Right -->
  <rect x="305" y="125" width="245" height="90" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="320" y="150" font-family="sans-serif" font-size="12" fill="#94a3b8">Active Database Connections</text>
  <text x="320" y="180" font-family="monospace" font-size="22" font-weight="bold" fill="#38bdf8">PostgreSQL : 48</text>
  <text x="320" y="200" font-family="sans-serif" font-size="11" fill="#34d399">Redis Cache Hit: 96.4%</text>

  <rect x="305" y="230" width="245" height="90" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="320" y="255" font-family="sans-serif" font-size="12" fill="#94a3b8">Security &amp; JWT Verification</text>
  <text x="320" y="285" font-family="monospace" font-size="20" font-weight="bold" fill="#a78bfa">OAuth2 + RBAC</text>
  <text x="320" y="305" font-family="sans-serif" font-size="11" fill="#10b981">Rate Limit: 100 req/min</text>
</svg>
