<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd2a6" />
      <stop offset="100%" stop-color="#f5b682" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Background -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" />
  
  <!-- Subtle Tech Ring / Hexagon Grid -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="8 6" opacity="0.35" />
  <circle cx="200" cy="200" r="160" fill="#0f172a" opacity="0.15" />

  <!-- Code/Tech Accent Symbols -->
  <text x="45" y="110" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff" opacity="0.5">&lt;/&gt;</text>
  <text x="320" y="120" font-family="monospace" font-size="26" font-weight="bold" fill="#38bdf8" opacity="0.6">{ }</text>
  <text x="50" y="300" font-family="monospace" font-size="22" font-weight="bold" fill="#a78bfa" opacity="0.45">0101</text>
  <text x="325" y="290" font-family="monospace" font-size="24" font-weight="bold" fill="#34d399" opacity="0.5">=&gt;</text>

  <!-- Body / Hoodie -->
  <path d="M 100 370 Q 115 280 200 280 Q 285 280 300 370 Z" fill="url(#shirtGrad)" />
  <!-- Inner T-shirt Collar -->
  <polygon points="175,280 225,280 200,320" fill="#6366f1" />

  <!-- Neck -->
  <rect x="180" y="240" width="40" height="50" rx="8" fill="url(#skinGrad)" />

  <!-- Head / Face -->
  <ellipse cx="200" cy="200" rx="65" ry="75" fill="url(#skinGrad)" />

  <!-- Ears -->
  <circle cx="135" cy="200" r="12" fill="#f5b682" />
  <circle cx="265" cy="200" r="12" fill="#f5b682" />

  <!-- Modern Haircut -->
  <path d="M 135 185 C 130 130, 160 110, 200 110 C 245 110, 270 135, 265 185 C 255 140, 235 130, 200 130 C 160 130, 145 150, 135 185 Z" fill="url(#hairGrad)" />

  <!-- Stylish Glasses -->
  <!-- Left Lens -->
  <rect x="150" y="180" width="42" height="30" rx="7" fill="rgba(255,255,255,0.25)" stroke="#1e293b" stroke-width="4" />
  <!-- Right Lens -->
  <rect x="208" y="180" width="42" height="30" rx="7" fill="rgba(255,255,255,0.25)" stroke="#1e293b" stroke-width="4" />
  <!-- Bridge -->
  <line x1="192" y1="192" x2="208" y2="192" stroke="#1e293b" stroke-width="4" />
  <!-- Frames to ears -->
  <line x1="150" y1="190" x2="135" y2="185" stroke="#1e293b" stroke-width="3" />
  <line x1="250" y1="190" x2="265" y2="185" stroke="#1e293b" stroke-width="3" />
  <!-- Eyes -->
  <circle cx="171" cy="195" r="5" fill="#1e293b" />
  <circle cx="229" cy="195" r="5" fill="#1e293b" />
  <!-- Glass reflection line -->
  <line x1="156" y1="184" x2="168" y2="196" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <line x1="214" y1="184" x2="226" y2="196" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Nose -->
  <path d="M 200 205 L 196 220 L 204 220" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Warm Smile -->
  <path d="M 185 235 Q 200 250 215 235" stroke="#1e293b" stroke-width="3.5" fill="none" stroke-linecap="round" />

  <!-- Badge in corner -->
  <g transform="translate(270, 270)">
    <circle cx="35" cy="35" r="32" fill="#10b981" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
    <!-- Checkmark or Terminal Icon -->
    <path d="M 24 35 L 32 43 L 48 27" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
