<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p4Grad)" />

  <!-- Dashboard Window -->
  <rect x="25" y="25" width="550" height="330" rx="12" fill="#09090b" stroke="#3f3f46" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="550" height="38" rx="12" fill="#18181b" />
  <circle cx="45" cy="44" r="5" fill="#ef4444" />
  <circle cx="63" cy="44" r="5" fill="#f59e0b" />
  <circle cx="81" cy="44" r="5" fill="#10b981" />
  <text x="105" y="48" font-family="sans-serif" font-size="12" font-weight="600" fill="#e4e4e7">Campus Grade &amp; Course Analytics</text>

  <!-- Left Donut Chart Graphic -->
  <g transform="translate(110, 165)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#27272a" stroke-width="18" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#6366f1" stroke-width="18" stroke-dasharray="260 380" stroke-linecap="round" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#06b6d4" stroke-width="18" stroke-dasharray="80 380" stroke-dashoffset="-260" stroke-linecap="round" />
    <text x="0" y="8" font-family="monospace" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3.85</text>
    <text x="0" y="24" font-family="sans-serif" font-size="10" fill="#a1a1aa" text-anchor="middle">Major GPA</text>
  </g>

  <!-- Stats Grid -->
  <rect x="215" y="80" width="160" height="75" rx="8" fill="#18181b" stroke="#27272a" />
  <text x="230" y="105" font-family="sans-serif" font-size="11" fill="#a1a1aa">Core CS Credits</text>
  <text x="230" y="135" font-family="monospace" font-size="24" font-weight="bold" fill="#6366f1">72 / 72</text>

  <rect x="390" y="80" width="165" height="75" rx="8" fill="#18181b" stroke="#27272a" />
  <text x="405" y="105" font-family="sans-serif" font-size="11" fill="#a1a1aa">Honor Roll Status</text>
  <text x="405" y="135" font-family="sans-serif" font-size="16" font-weight="bold" fill="#10b981">First Class Rank</text>

  <!-- Course Distribution Bar Chart -->
  <rect x="215" y="170" width="340" height="165" rx="8" fill="#18181b" stroke="#27272a" />
  <text x="235" y="195" font-family="sans-serif" font-size="12" font-weight="600" fill="#f4f4f5">Semester Performance Trend</text>
  
  <!-- Mini Line / Trend Chart -->
  <polyline points="245,285 295,255 350,265 410,230 470,215 525,210" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <circle cx="245" cy="285" r="4" fill="#06b6d4" />
  <circle cx="295" cy="255" r="4" fill="#06b6d4" />
  <circle cx="350" cy="265" r="4" fill="#06b6d4" />
  <circle cx="410" cy="230" r="4" fill="#06b6d4" />
  <circle cx="470" cy="215" r="4" fill="#06b6d4" />
  <circle cx="525" cy="210" r="4" fill="#10b981" />
  
  <text x="245" y="310" font-family="sans-serif" font-size="10" fill="#71717a" text-anchor="middle">Y1S1</text>
  <text x="295" y="310" font-family="sans-serif" font-size="10" fill="#71717a" text-anchor="middle">Y1S2</text>
  <text x="350" y="310" font-family="sans-serif" font-size="10" fill="#71717a" text-anchor="middle">Y2S1</text>
  <text x="410" y="310" font-family="sans-serif" font-size="10" fill="#71717a" text-anchor="middle">Y2S2</text>
  <text x="470" y="310" font-family="sans-serif" font-size="10" fill="#71717a" text-anchor="middle">Y3S1</text>
  <text x="525" y="310" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle">Y3S2</text>
</svg>
