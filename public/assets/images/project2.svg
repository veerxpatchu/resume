<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="barGradActive" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barGradPivot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="16" fill="url(#p2Grad)" />

  <!-- Code/Visualizer Header -->
  <rect x="25" y="25" width="550" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="45" cy="45" r="6" fill="#ef4444" />
  <circle cx="65" cy="45" r="6" fill="#f59e0b" />
  <circle cx="85" cy="45" r="6" fill="#10b981" />
  <text x="120" y="49" font-family="monospace" font-size="13" fill="#38bdf8">QuickSort Visualizer [O(n log n)]</text>
  <rect x="440" y="33" width="70" height="24" rx="4" fill="#0284c7" />
  <text x="475" y="49" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Step &gt;&gt;</text>

  <!-- Sorting Bars Chart Visualization -->
  <!-- Base Grid Line -->
  <line x1="40" y1="280" x2="560" y2="280" stroke="#334155" stroke-width="2" />

  <!-- Dynamic Bars -->
  <rect x="60" y="220" width="22" height="60" rx="3" fill="#475569" />
  <rect x="90" y="160" width="22" height="120" rx="3" fill="#475569" />
  <rect x="120" y="240" width="22" height="40" rx="3" fill="#475569" />
  
  <!-- Active Compare Bars -->
  <rect x="150" y="110" width="22" height="170" rx="3" fill="url(#barGradPivot)" />
  <rect x="180" y="180" width="22" height="100" rx="3" fill="url(#barGradActive)" />
  
  <rect x="210" y="80" width="22" height="200" rx="3" fill="#475569" />
  <rect x="240" y="130" width="22" height="150" rx="3" fill="url(#barGradActive)" />
  <rect x="270" y="200" width="22" height="80" rx="3" fill="#475569" />
  <rect x="300" y="90" width="22" height="190" rx="3" fill="#10b981" />
  <rect x="330" y="140" width="22" height="140" rx="3" fill="#10b981" />
  <rect x="360" y="170" width="22" height="110" rx="3" fill="#10b981" />
  <rect x="390" y="210" width="22" height="70" rx="3" fill="#10b981" />
  <rect x="420" y="70" width="22" height="210" rx="3" fill="#10b981" />
  <rect x="450" y="120" width="22" height="160" rx="3" fill="#10b981" />
  <rect x="480" y="190" width="22" height="90" rx="3" fill="#475569" />
  <rect x="510" y="250" width="22" height="30" rx="3" fill="#475569" />

  <!-- Code snippet in bottom -->
  <rect x="40" y="295" width="520" height="60" rx="8" fill="#0b1120" stroke="#1e293b" />
  <text x="60" y="320" font-family="monospace" font-size="12" fill="#a78bfa">int</text>
  <text x="90" y="320" font-family="monospace" font-size="12" fill="#38bdf8">partition</text>
  <text x="160" y="320" font-family="monospace" font-size="12" fill="#94a3b8">(int arr[], int low, int high) { int pivot = arr[high]; ... }</text>
  <text x="60" y="340" font-family="monospace" font-size="12" fill="#10b981">// Swapping arr[i] with arr[j] &amp; tracking comparisons</text>
</svg>
